[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-test01"
version = "0.1.0"
description = "Production vulnerability scanner for professional penetration testers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "D3RWOLF1" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
pen-test01 = "pen_test01.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
